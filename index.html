async function sync(){if(!S.profile||!db||!profileId())return false;try{const r=await db.rpc('academia_progress',{p_profile_id:profileId()});if(r.error)throw r.error;const rows=Array.isArray(r.data)?r.data:(r.data?[r.data]:[]);const completed=[],xpByTrack=[];rows.forEach(x=>{if(String(x.status||'').toLowerCase()==='completed'){const i=Number(x.track_number)-1;if(Number.isInteger(i)&&i>=0&&i<CONTENT.length){completed.push(i);xpByTrack.push(Number(x.xp)||100)}}});S.completed=[...new Set(completed)].sort((a,b)=>a-b);S.xp=xpByTrack.reduce((a,b)=>a+b,0);save();return true}catch(e){console.error('Falha ao sincronizar progresso no Supabase:',e);toast('Não foi possível sincronizar o progresso. Confira a conexão e tente novamente.');return false}}
function showNav(v=true){$('navbottom').style.display=v?'block':'none';$('adminNav').style.display=(v&&isAdmin())?'block':'none'}
function login(){showNav(false);$('app').innerHTML=`<div class="login"><img class="loginLogo" src="logo-om-solar.png" alt="O&M Solar"><img class="mascot" src="mascote-guardiao-transparent.png" alt="Guardião da Usina"><h1>GUARDIÕES DA USINA</h1><p>Academia de Segurança O&M Solar</p><input id="mat" placeholder="Matrícula" autocomplete="username"><input id="pin" placeholder="PIN" type="password" inputmode="numeric" autocomplete="current-password"><div id="err" class="muted" style="min-height:22px"></div><button class="btn" id="go">ENTRAR →</button></div>`;$('go').onclick=doLogin;$('pin').onkeydown=e=>{if(e.key==='Enter')doLogin()}}
async function doLogin(){if(!db)return $('err').textContent='Serviço de autenticação indisponível. Recarregue a página.';let m=$('mat').value.trim(),p=$('pin').value.trim();if(!m||!p)return $('err').textContent='Informe matrícula e PIN.';$('go').disabled=true;$('err').textContent='Validando…';try{let r=await db.rpc('academia_login',{p_matricula:m,p_pin:p});if(r.error||!r.data?.length)throw new Error('Matrícula ou PIN inválidos.');S.profile=r.data[0];save();await sync();if(!restoreLesson())home()}catch(e){$('err').textContent=e.message||'Não foi possível entrar.';$('go').disabled=false}}
function header(){return `<div class="top"><img class="brand" src="logo-om-solar.png" alt="O&M Solar"><div class="stats"><span class="stat">🔥 ${S.completed.length} dias</span><span class="stat">⚡ ${S.xp} XP</span></div></div>`}
function home(){
  if(!S.profile)return login();
  showNav(true);
  let next=S.completed.length>=300?299:CONTENT.findIndex((_,i)=>!S.completed.includes(i));
  let html=header()+`<div class="hero"><img class="mascot" src="mascote-guardiao-transparent.png" alt="Guardião da Usina"><h1>GUARDIÕES DA USINA</h1><p>Uma jornada de 300 microtreinamentos para segurança, elétrica, manutenção e diagnóstico em usinas fotovoltaicas.</p></div><div class="homeStats"><div class="homeStat"><b>${S.completed.length}</b><span>concluídos</span></div><div class="homeStat"><b>${300-S.completed.length}</b><span>restantes</span></div><div class="homeStat"><b>${S.xp}</b><span>XP total</span></div></div>`;
  if(next>=0&&next<300){
    let t=CONTENT[next];
    html+=`<div class="today"><div class="todayHead"><b>Treinamento de hoje</b><span class="pill">Dia ${next+1}</span></div><h2>${esc(t.n)}</h2><p>${esc(t.p)}</p><button class="btn" id="todayBtn">CONTINUAR TREINAMENTO →</button></div>`;
  }else{
    html+=`<div class="today"><b>Jornada concluída!</b><p>Você completou os 300 microtreinamentos.</p></div>`;
  }
  const sections=['Fundamentos da Segurança','NR-10 e Segurança Elétrica','Elétrica Fotovoltaica','Inversores, QGBT e Proteções','Transformadores e Média Tensão','Manutenção Elétrica','Equipamentos e Automação da UFV','NR-12, Máquinas e Partes Móveis','EPI, EPC e Proteção do Trabalhador','Trabalho em Altura e Condições Ambientais','Riscos Ambientais, Produtos e Operação de Campo','Diagnóstico, COG e Guardião da Usina'];
  let last='';
  CONTENT.forEach((t,i)=>{
    if(t.p!==last){
      if(last)html+='</div>';
      last=t.p;
      let sec=sections.indexOf(last)+1;
      html+=`<div class="ph"><small>BLOCO ${sec}</small><h2>${esc(last)}</h2></div><div class="path">`;
    }
    let done=S.completed.includes(i),u=unlock(i),cur=i===next;
    html+=`<button class="node ${done?'ok':cur?'cur':!u?'lock':''} ${i%2?'f':''}" ${u&&!done?'data-start="'+i+'"':''} ${u?'':'disabled'}>${done?'✓':t.i}<span>${esc(t.n)}${u?'':'<br>bloqueado'}</span></button>`;
  });
  if(last)html+='</div>';
  
  $('app').innerHTML=html;
  document.querySelectorAll('[data-start]').forEach(b=>b.addEventListener('click',()=>start(Number(b.dataset.start))));
  if($('todayBtn'))$('todayBtn').onclick=()=>start(next);
}
function start(k){if(!unlock(k))return toast('Este treinamento ainda não foi liberado.');showNav(false);L={k,stage:0,life:5,score:0,q:0,selected:null,result:null};saveLesson();learn()}
function progress(){let t=CONTENT[L.k],total=15,done=L.stage;return Math.round(done/total*100)}
function stageTabs(active){return `<div class="stageTabs"><span class="on">1 Aprenda</span><span>2 Exercício</span><span>3 Resumo</span></div>`}
function lesson(){let t=CONTENT[L.k],s=t.l[L.stage];$('app').innerHTML=`<div class="lh"><button class="x" id="closeLesson">‹</button><img class="miniLogo" src="logo-om-solar.png" alt="O&M Solar"><div class="bar"><i style="width:${Math.round((L.stage)/3*100)}%"></i></div><span class="hearts">${'❤️'.repeat(L.life)}</span></div><div class="card"><small>DIA ${L.k+1} · CONTEÚDO ${L.stage+1} DE 3</small>${stageTabs(1)}<h2 class="q">${esc(s[0])}</h2><p>${esc(s[1])}</p><ul>${s[2].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="actionDock"><button class="btn" id="lessonNext">${L.stage<2?'PRÓXIMO':'IR PARA O EXERCÍCIO'} →</button></div>`;$('closeLesson').onclick=()=>{if(L.stage>0){L.stage--;saveLesson();lesson()}else{clearLesson();L=null;home()}};$('lessonNext').onclick=nextLesson}
function nextLesson(){L.stage++;saveLesson();if(L.stage<3)lesson();else question()}
function learn(){if(L.stage<3)lesson();else question()}
function nextLesson(){L.stage++;saveLesson();if(L.stage<3)lesson();else question()}
function question(){let t=CONTENT[L.k],q=t.x[L.q];let pct=Math.round((L.q)/3*100);$('app').innerHTML=`<div class="lh"><button class="x" id="closeQuestion">‹</button><img class="miniLogo" src="logo-om-solar.png" alt="O&M Solar"><div class="bar"><i style="width:${pct}%"></i></div><span class="hearts">${'❤️'.repeat(L.life)||'💔'}</span></div><div class="card"><small>DIA ${L.k+1} · EXERCÍCIO ${L.q+1} DE 3</small><div class="stageTabs"><span>1 Aprenda</span><span class="on">2 Exercício</span><span>3 Resumo</span></div><h2 class="q">${esc(q[0])}</h2>${q[1].map((o,i)=>`<button class="opt ${L.selected===i?'s':''}" data-opt="${i}" ${L.result!==null?'disabled':''}><b>${String.fromCharCode(65+i)}</b> &nbsp; ${esc(o)}</button>`).join('')}</div><div class="actionDock" id="questionDock">${L.result===null?'<button class="btn" id="verifyBtn" disabled>VERIFICAR RESPOSTA</button>':''}</div>`;$('closeQuestion').onclick=()=>{L.stage=2;saveLesson();lesson()};document.querySelectorAll('[data-opt]').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.opt))));if(L.result===null){$('verifyBtn').disabled=L.selected===null;$('verifyBtn').onclick=check}else showQuestionFeedback(q)}
function choose(i){if(L.result!==null)return;L.selected=i;saveLesson();document.querySelectorAll('[data-opt]').forEach(b=>{b.classList.toggle('s',Number(b.dataset.opt)===i)});$('verifyBtn').disabled=false}
function check(){let q=CONTENT[L.k].x[L.q];if(L.selected===null)return;let selected=L.selected;L.result=selected===q[2];if(L.result)L.score++;else L.life--;saveLesson();document.querySelectorAll('[data-opt]').forEach(b=>{let i=Number(b.dataset.opt);b.disabled=true;b.classList.remove('s');if(i===q[2])b.classList.add('ok');if(i===selected&&selected!==q[2])b.classList.add('no')});showQuestionFeedback(q)}
function showQuestionFeedback(q){let dock=$('questionDock');if(!dock)return;dock.innerHTML=`<div class="feedbackBox ${L.result?'ok':'no'}"><b>${L.result?'✓ Muito bem!':'✕ Revise este ponto.'}</b><br>${esc(q[3]||'Revise o conceito e tente novamente.')}</div><button class="btn ${L.result?'':'r'}" id="nextQBtn">${L.q<2?'PRÓXIMO EXERCÍCIO':'VER RESULTADO'} →</button>`;$('nextQBtn').onclick=nextQ}
async function nextQ(){if(L.life<=0)return finish(false);L.q++;if(L.q>=3)return finish(true);L.selected=null;L.result=null;saveLesson();question()}
async function finish(completedAttempt){
  showNav(false);
  const t=CONTENT[L.k],score=Math.round(L.score/3*100),pass=completedAttempt&&score>=67&&L.life>0;
  if(!pass){clearLesson();$('app').innerHTML=`<div class="complete"><div class="big">💔</div><h1>Vamos tentar novamente</h1><p>Você fez ${score}%. É necessário acertar pelo menos 2 dos 3 exercícios para concluir.</p><button class="btn r" id="retryBtn">TENTAR NOVAMENTE</button><br><button class="btn" id="returnPathBtn">VOLTAR À TRILHA</button></div>`;$('retryBtn').onclick=()=>start(L.k);$('returnPathBtn').onclick=()=>{L=null;clearLesson();home()};return}
  const profile=profileId();
  if(!profile){toast('Perfil não identificado. Saia e entre novamente.');console.error('Conclusão cancelada: profile_id ausente',S.profile);return}
  const code='OEM-'+String(t.id).padStart(3,'0')+'-'+Date.now().toString(36).toUpperCase();
  const btn=$('nextQBtn');if(btn){btn.disabled=true;btn.textContent='REGISTRANDO CONCLUSÃO…'}
  try{
    if(!db)throw new Error('Cliente Supabase indisponível');
    const r=await db.rpc('academia_complete_training',{p_profile_id:profile,p_track_number:t.id,p_certificate_code:code,p_score:score});
    if(r.error)throw r.error;
    if(r.data===false)throw new Error('O Supabase não confirmou a conclusão');
    S.completed=[...new Set([...S.completed,L.k])].sort((a,b)=>a-b);
    S.xp=S.completed.reduce((sum)=>sum+100,0);
    S.certs=S.certs.filter(c=>c.i!==L.k);S.certs.push({i:L.k,code,score,date:new Date().toISOString()});save();clearLesson();
    const completedIndex=L.k;L=null;
    // Read back from server; if sync fails, keep the confirmed local state and show a warning in console.
    await sync();
    showNav(false);
    const nextIndex=CONTENT.findIndex((_,i)=>!S.completed.includes(i));
    $('app').innerHTML=`<div class="complete"><img class="heroLogo" src="logo-om-solar.png" alt="O&M Solar"><img class="mascot" src="mascote-guardiao-transparent.png" alt="Guardião da Usina"><div class="big">🏆</div><h1>Treinamento concluído!</h1><p>${esc(t.n)}<br>Resultado: ${score}% · +100 XP</p><p>✅ Conclusão registrada.</p><button class="btn b" id="certificateBtn">VER CERTIFICADO →</button><br><button class="btn" id="continueJourneyBtn">${nextIndex>=0?'CONTINUAR PARA O DIA '+(nextIndex+1):'VER JORNADA CONCLUÍDA'} →</button></div>`;
    $('certificateBtn').onclick=()=>certificate(completedIndex,code,score);
    $('continueJourneyBtn').onclick=()=>{if(nextIndex>=0&&unlock(nextIndex))start(nextIndex);else home()};
  }catch(e){
    console.error('Falha ao registrar conclusão no Supabase:',{message:e?.message,details:e?.details,hint:e?.hint,code:e?.code,error:e});
    const msg=e?.message||e?.details||'Erro desconhecido';
    $('app').innerHTML=`<div class="complete"><div class="big">⚠️</div><h1>Não foi possível salvar</h1><p>A conclusão não foi confirmada pelo servidor. Seu treinamento foi mantido nesta sessão; tente novamente.</p><div class="person" style="text-align:left;font-size:12px;overflow-wrap:anywhere">Detalhe técnico: ${esc(msg)}</div><button class="btn" id="retrySaveBtn">TENTAR SALVAR NOVAMENTE</button><br><button class="btn" id="backTrainingBtn">VOLTAR AO TREINAMENTO</button></div>`;
    $('retrySaveBtn').onclick=()=>finish(true);$('backTrainingBtn').onclick=()=>{L.q=2;L.selected=CONTENT[L.k].x[2][2];L.result=true;saveLesson();question()};
  }
}

async function adminDashboard(){if(!isAdmin())return home();showNav(true);$('app').innerHTML=header()+`<div class="hero"><div class="big">📊</div><h1>Evolução da equipe</h1><p>Visão administrativa da Academia.</p></div><div id="admData" class="card"><p>Carregando...</p></div>`;try{let r=await db.rpc('academia_admin_dashboard',{p_profile_id:S.profile.profile_id});if(r.error)throw r.error;let d=r.data||{};$('admData').innerHTML=`<div class="person"><b>Colaboradores</b><br>${d.collaborators||0}</div><div class="person"><b>Conclusões</b><br>${d.completed||0}</div><div class="person"><b>Média</b><br>${d.avg_score||0}%</div><div class="person"><b>Certificados</b><br>${d.certificates||0}</div>${(d.people||[]).map(p=>`<div class="person"><b>${esc(p.full_name||'')}</b><br>${esc(p.employee_code||'')} · ${p.completed||0}/300 · ${p.avg_score||0}% · ${p.xp||0} XP</div>`).join('')}`}catch(e){$('admData').innerHTML='<p>Não foi possível carregar a evolução administrativa.</p>';console.error(e)}}
function certificates(){if(!S.profile)return login();showNav(true);let h=header()+`<div class="hero"><div class="big">🎓</div><h1>Certificados</h1><p>Treinamentos concluídos.</p></div>`;if(!S.certs.length)h+=`<div class="card"><p>Ainda não há certificados nesta sessão.</p></div>`;S.certs.forEach(c=>{let t=CONTENT[c.i];h+=`<div class="person"><b>${esc(t.n)}</b><br><span class="muted">Resultado: ${c.score}% · Código: ${esc(c.code)}</span><button class="btn b" style="margin-top:10px" onclick="certificate(${c.i},'${esc(c.code)}',${c.score})">ABRIR</button></div>`});$('app').innerHTML=h}
function certificate(i,code,score){let t=CONTENT[i],p=S.profile,w=open('','_blank');if(!w)return toast('Permita a abertura da janela para ver o certificado.');w.document.write(`<title>Certificado - O&M Solar</title><body style="margin:0;background:#f4f7f8;font:16px Arial;color:#26343d;padding:40px"><div style="max-width:850px;margin:auto;background:#fff;border:6px solid #1cb0f6;border-radius:24px;padding:55px;text-align:center"><div style="font-size:54px">🛡️</div><p style="color:#1cb0f6;font-weight:bold">ACADEMIA DE SEGURANÇA O&M SOLAR</p><h1>CERTIFICADO DE PARTICIPAÇÃO</h1><p>Certificamos que</p><h2>${esc(p.full_name||'')}</h2><p>Matrícula: ${esc(p.employee_code||'')}</p><p>Cargo: ${esc(p.job_title||'—')} · Unidade: ${esc(p.plant||'—')}</p><p>concluiu o treinamento</p><h2>${esc(t.n)}</h2><p>Resultado: ${score}% · Data: ${new Date().toLocaleDateString('pt-BR')}</p><p>Código: ${esc(code)}</p><hr><small>Documento interno de participação e conclusão de treinamento. Não substitui capacitação, habilitação, autorização ou certificado oficial exigido por Norma Regulamentadora. Sem assinatura.</small></div><script>setTimeout(()=>print(),300)<\/script></body>`);w.document.close()}
function profile(){if(!S.profile)return login();showNav(true);$('app').innerHTML=header()+`<div class="hero"><div class="big">👤</div><h1>${esc(S.profile.full_name||'Guardião')}</h1><p>Matrícula: ${esc(S.profile.employee_code||'—')}<br>${esc(S.profile.job_title||'—')} · ${esc(S.profile.plant||'—')}</p><div class="person"><b>Progresso</b><br>${S.completed.length}/300 treinamentos · ${S.xp} XP</div><button class="btn r" onclick="logout()">SAIR</button></div>`}
function logout(){S={profile:null,completed:[],xp:0,certs:[]};L=null;clearLesson();localStorage.removeItem('academia_final');login()}
$('homeNav').onclick=home;$('certNav').onclick=certificates;$('profileNav').onclick=profile;$('adminNav').onclick=adminDashboard;
if(S.profile){sync().then(()=>{if(!restoreLesson())home()}).catch(()=>home())}else login();
</script></body></html>
