<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Academia de Segurança O&M Solar</title><link rel="stylesheet" href="game.css">
</head><body>
<header class="top"><button id="brand" class="brand"><img src="logo-om-solar.png"><span><b>ACADEMIA DE SEGURANÇA</b><small>GUARDIÕES DA USINA</small></span></button>
<nav id="nav"></nav><div class="account"><span id="headerXp"></span><button id="loginBtn" class="loginBtn">ENTRAR</button></div></header>
<main id="app"></main>
<div id="loginModal" class="modal"><div class="shade"></div><div class="loginBox"><button id="loginClose" class="close">×</button><span class="eyebrow">ACESSO</span><h2>Entre na sua jornada</h2><p>Use sua matrícula e PIN para continuar.</p><form id="loginForm"><label>Matrícula</label><input id="mat" inputmode="numeric" required><label>PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="8" required><div id="loginError"></div><button class="primary full">ENTRAR NA ACADEMIA →</button></form></div></div>
<div id="gameModal" class="modal"><div class="shade"></div><div class="game"><div class="gameTop"><b>🛡️ GUARDIÕES DA USINA</b><span id="gameXp"></span><button id="gameClose" class="close">×</button></div><div class="gameGrid"><aside id="tracks"></aside><section class="lesson"><div id="head"></div><div class="tabs"><button data-tab="lesson">TREINAMENTO</button><button data-tab="case">CASO</button><button data-tab="refs">REFERÊNCIAS</button><button data-tab="exam">AVALIAÇÃO</button></div><div id="lesson"></div></section><aside class="side"><div class="ring"><span id="pct">0%</span></div><div class="bar"><i id="bar"></i></div><div id="outline"></div><button id="continue" class="primary full">CONTINUAR →</button></aside></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="content.js"></script><script src="game.js"></script>
</body></html>
