<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#58cc02"><title>Academia de Segurança O&M Solar</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--g:#58cc02;--gd:#46a302;--b:#1cb0f6;--bd:#1899d6;--r:#ff4b4b;--y:#ffc800;--t:#3c3c3c;--m:#777;--l:#e5e5e5;--bg:#fff}*{box-sizing:border-box}body{margin:0;font:800 16px Nunito,system-ui,sans-serif;color:var(--t);background:#fff}button,input{font:inherit}button{cursor:pointer}#app{max-width:560px;margin:auto;min-height:100vh;padding:0 16px 120px}.top{display:flex;justify-content:space-between;align-items:center;padding:13px 0;position:sticky;top:0;background:#fff;border-bottom:2px solid var(--l);z-index:5;gap:10px}.top .stats{display:flex;gap:12px;font-size:14px;white-space:nowrap}.top .user{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}.ph{margin:25px 0 4px;padding:15px 17px;border-radius:16px;background:var(--g);color:#fff;box-shadow:0 4px 0 var(--gd)}.ph small{opacity:.85}.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding:22px 0 10px;position:relative}.path:before{content:"";position:absolute;top:0;bottom:0;width:8px;background:#e9e9e9;border-radius:5px;z-index:0}.node{width:76px;height:76px;border-radius:50%;border:0;font-size:29px;background:#e5e5e5;box-shadow:0 6px 0 #c8c8c8;position:relative;z-index:1;transition:.15s}.node:hover:not(:disabled){transform:scale(1.04)}.node.cur{background:var(--b);box-shadow:0 6px 0 var(--bd);animation:p 1.6s infinite;color:#fff}.node.ok{background:var(--g);box-shadow:0 6px 0 var(--gd);color:#fff}.node.lock{opacity:.5;filter:grayscale(.2)}.node span{position:absolute;left:92px;top:19px;width:155px;text-align:left;font-size:12px;color:var(--m);line-height:1.25}.node.f span{left:auto;right:92px;text-align:right}.node.f{transform:translateX(-55px)}.node:nth-child(even){transform:translateX(55px)}.node:nth-child(even).f{transform:translateX(-55px)}@keyframes p{50%{transform:scale(1.07)}}@media(prefers-reduced-motion:reduce){.node.cur{animation:none}}.hero{text-align:center;padding:20px 0 8px}.hero .shield{font-size:62px}.hero h1{font-size:28px;margin:4px 0}.hero p{color:var(--m);font-weight:700;margin:4px 0 15px}.btn{display:block;width:100%;padding:14px;border:0;border-radius:16px;font:900 16px Nunito,sans-serif;letter-spacing:.4px;color:#fff;background:var(--g);box-shadow:0 4px 0 var(--gd);cursor:pointer}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gd)}.btn:disabled{background:var(--l);color:#aaa;box-shadow:0 4px 0 #cfcfcf;cursor:default}.btn.b{background:var(--b);box-shadow:0 4px 0 var(--bd)}.btn.r{background:var(--r);box-shadow:0 4px 0 #d33}input{width:100%;padding:14px;margin:6px 0;border:2px solid var(--l);border-radius:14px;font:800 16px Nunito,sans-serif;background:#f7f7f7}.login{text-align:center;padding-top:70px}.big{font-size:64px}.login p,.muted{color:var(--m)}.lh{display:flex;gap:12px;align-items:center;padding:15px 0;position:sticky;top:0;background:#fff;z-index:4}.x{border:0;background:none;font-size:26px;color:var(--m)}.bar{flex:1;height:14px;border-radius:9px;background:var(--l);overflow:hidden}.bar i{display:block;height:100%;background:var(--g);transition:width .3s}.hearts{white-space:nowrap;font-size:15px}.q{font-size:23px;line-height:1.25;margin:18px 0}.card{padding:8px 0 100px}.card small{color:var(--bd)}.card p{line-height:1.6;color:#555;font-weight:700;font-size:17px}.card li{margin:10px 0;line-height:1.45;padding:11px 12px;border-radius:12px;background:#ddf4ff;list-style:none}.card ul{padding:0}.opt{display:block;width:100%;text-align:left;padding:15px;margin:11px 0;border:2px solid var(--l);border-bottom-width:4px;border-radius:16px;background:#fff;font:800 16px Nunito,sans-serif;color:var(--t);cursor:pointer}.opt.s{border-color:var(--b);background:#ddf4ff}.opt.ok{border-color:var(--g);background:#d7ffb8}.opt.no{border-color:var(--r);background:#ffdfe0}.fb{position:fixed;left:0;right:0;bottom:0;padding:15px;border-top:2px solid var(--l);background:#fff;z-index:8}.fb>div{max-width:560px;margin:auto}.fb.ok{background:#d7ffb8}.fb.no{background:#ffdfe0}.fb p{margin:0 0 12px;line-height:1.4}.complete{text-align:center;padding:55px 0}.complete .big{font-size:75px}.complete h1{font-size:28px}.admin{padding:20px 0}.person{border:2px solid var(--l);border-radius:16px;padding:13px;margin:10px 0}.navbottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--l);padding:9px 16px;z-index:6}.navbottom>div{max-width:560px;margin:auto;display:flex;gap:8px}.navbottom button{flex:1;border:0;background:#fff;color:var(--m);font-weight:900;padding:7px 3px;border-radius:12px}.navbottom button.active{background:#eef9e9;color:var(--gd)}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#3c3c3c;color:#fff;padding:10px 14px;border-radius:12px;z-index:20;display:none}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div><div class="navbottom" id="navbottom" style="display:none"><div><button id="homeNav">🏠<br>Trilha</button><button id="certNav">🎓<br>Certificados</button><button id="profileNav">👤<br>Perfil</button><button id="adminNav" style="display:none">📊<br>Equipe</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const CONTENT=[{"n":"NR-10 e instalações elétricas","i":"⚡","p":"Fundamentos","l":[["O que é a NR-10","A NR-10 define medidas de controle para quem trabalha com eletricidade em todas as etapas: projeto, execução, operação e manutenção. Em usina solar vale para o lado CC e para o lado CA.",["Vale para quem trabalha na instalação ou perto dela","Exige capacitação e autorização formal","Procedimento e análise de risco são obrigatórios"]],["Por que a eletricidade é tão perigosa","O choque pode causar parada cardíaca, queimaduras e queda. O arco elétrico libera calor extremo e projeta metal. Você não vê nem ouve o perigo: um circuito ligado e um desligado parecem iguais.",["Choque: corrente passando pelo corpo","Arco: calor, luz e projeção de metal","Aparência nunca prova que está desligado"]],["Zona de risco e zona controlada","Ao redor de partes energizadas existem zonas com distâncias de segurança. A zona controlada é a mais externa, e a zona de risco é a mais próxima. Entrar nelas exige autorização e proteção. Quanto maior a tensão, maiores as distâncias.",["Zona controlada: só pessoas autorizadas","Zona de risco: mais perto, com mais proteção","Distâncias crescem com a tensão"]],["Desenergizar: a ordem importa","Antes do serviço, siga a sequência: seccionamento, impedimento de reenergização, constatação de ausência de tensão, aterramento temporário, proteção de partes energizadas próximas e sinalização. Pular etapa é o que causa os acidentes graves.",["Meça sempre antes de tocar","Em CC solar, a geração continua com luz","Condição diferente do planejado: pare e reavalie"]],["Aplicação em campo — NR-10 e instalações elétricas","Consolide o controle de segurança aplicado a nr-10 e instalações elétricas.",["Confirme a condição real antes de agir.","Aplique o procedimento vigente.","Pare e comunique se houver desvio."]]],"x":[["Na UFV, o inversor foi desligado e a seccionadora CA aberta. Os cabos CC das strings estão sem tensão?",["Sim, está tudo desligado","Não: os módulos geram CC enquanto houver luz","Só em dia nublado"],1,"Os módulos geram tensão sempre que recebem luz. Desligar o inversor não zera o lado CC."],["Coloque a desenergização na ordem correta (NR-10):",["A sequência indicada no procedimento e na etapa de planejamento","Começar imediatamente e corrigir depois","Escolher a opção mais rápida","Pular as etapas de controle"],0,"Essa sequência evita que alguém trabalhe em um circuito que só parece desligado."],["O cabo parece desligado. Como confirmar?",["Encostar o dorso da mão","Medir com instrumento adequado, testado antes do uso","Confiar na palavra do colega"],1,"Ausência de tensão se constata com instrumento, nunca por aparência."],["Quem pode executar serviço em instalação elétrica?",["Quem tem experiência","Quem é capacitado e autorizado formalmente","Qualquer um, com supervisão"],1,"A NR-10 exige capacitação e autorização formal do trabalhador."],["A condição encontrada é diferente da planejada. E agora?",["Seguir, a equipe conhece o local","Parar, comunicar e reavaliar o risco antes de retomar","Improvisar um bloqueio"],1,"Mudou a condição, muda a análise de risco."],["Qual é uma barreira essencial antes de iniciar um serviço elétrico?",["Somente capacete","Controle das energias e confirmação da condição segura","Apenas sinalização visual","Somente experiência"],1,"O controle da energia e a confirmação da condição segura são barreiras fundamentais."],["Em uma UFV, por que o lado CC merece atenção mesmo com o inversor parado?",["Porque módulos continuam gerando com luz","Porque nunca existe tensão","Porque só existe CA","Porque o inversor gera a tensão"],0,"A geração fotovoltaica continua enquanto os módulos recebem luz."],["O que fazer quando o procedimento previsto não corresponde à condição encontrada?",["Improvisar","Continuar normalmente","Parar, comunicar e reavaliar","Ignorar a diferença"],2,"Mudança de condição exige reavaliação do risco antes da continuidade."],["Qual atitude é inadequada durante uma intervenção elétrica?",["Confirmar o procedimento","Usar instrumento adequado","Pular uma etapa porque o equipamento parece desligado","Comunicar desvios"],2,"A aparência do equipamento não comprova ausência de energia."],["Quem deve conhecer os riscos e controles antes da execução?",["Somente o cliente","Somente o COG","A equipe envolvida, conforme suas responsabilidades","Somente o almoxarife"],2,"A execução segura depende de entendimento compartilhado dos riscos e controles."]],"id":1,"badge":"Guardião 01","description":"Treinamento de segurança: NR-10 e instalações elétricas."},{"n":"Riscos elétricos CC e CA","i":"🔌","p":"Fundamentos","l":[["CC e CA: o que muda","No lado CC, os módulos geram energia sempre que há luz, e as strings chegam a 1000 V ou 1500 V. No lado CA, o inversor entrega energia à rede e existe também a tensão da própria rede. Os dois lados exigem bloqueio e medição.",["CC: gera enquanto houver luz","CA: pode ser alimentada pela rede","Seccionar um lado não desenergiza o outro"]],["O arco em CC","Na corrente alternada a tensão passa por zero várias vezes por segundo, o que ajuda a apagar o arco. Na CC isso não ocorre, e o arco pode se manter, queimar gravemente e iniciar incêndio. Por isso conectores não se desconectam sob carga.",["Nunca abrir MC4 sob carga","Seccionar antes de qualquer intervenção","Cabo ou conector danificado é fonte de arco"]],["Inspeção de cabos e conectores","Conector mal crimpado, cabo amassado ou isolação ressecada esquentam e geram arco. Na inspeção, procure cor alterada, cheiro, derretimento, cabos soltos e sinais de roedores. Isole o ponto e comunique, sem consertar fora do procedimento.",["Sinais: descoloração, cheiro, derretimento","Sem reparo improvisado em CC","Registre e comunique o desvio"]],["Como medir com segurança","Use multímetro com categoria e tensão compatíveis com o circuito, ponteiras em bom estado e luvas isolantes. Teste o instrumento antes e depois da medição. Medir confirma a condição, mas não substitui o bloqueio.",["Instrumento compatível com a tensão","Teste o instrumento antes de usar","Medir não substitui bloquear"]],["Aplicação em campo — Riscos elétricos CC e CA","Consolide o controle de segurança aplicado a riscos elétricos cc e ca.",["Confirme a condição real antes de agir.","Aplique o procedimento vigente.","Pare e comunique se houver desvio."]]],"x":[["Por que o arco em circuito CC é difícil de extinguir?",["A corrente CC não passa por zero, e o arco se mantém","CC é sempre baixa tensão","Não existe arco em CC"],0,"Sem passagem por zero, o arco CC pode persistir e causar queimaduras graves."],["Você precisa desconectar conectores MC4 de uma string. Quando é seguro?",["Rápido, com a string em carga","Após seccionar e confirmar que não há corrente, conforme o procedimento","Só quando estiver nublado"],1,"Desconectar sob carga pode gerar arco CC."],["Verdadeiro ou falso: cabo CC com isolação danificada pode estar energizado mesmo com pouco sol.",["Verdadeiro","Falso"],0,"Há tensão com pouca luz. Trate sempre como energizado."],["Qual é a sequência correta para a intervenção em uma string CC:",["A sequência indicada no procedimento e na etapa de planejamento","Começar imediatamente e corrigir depois","Escolher a opção mais rápida","Pular as etapas de controle"],0,"Em CC solar a geração continua com luz, então confirme sempre por medição."],["Qual instrumento para medir tensão de string de 1000 V?",["Multímetro com categoria e tensão compatíveis, e luvas isolantes","Qualquer multímetro","Alicate comum"],0,"Instrumento e luva precisam suportar a tensão do circuito."],["Qual condição pode manter tensão no lado CC?",["Luz incidindo nos módulos","Somente chuva","Somente o inversor ligado","Somente a rede CA"],0,"Módulos fotovoltaicos produzem tensão quando recebem luz."],["O que nunca deve ser feito com um conector CC sob carga?",["Inspecionar visualmente","Desconectar de forma improvisada","Registrar anomalia","Aplicar procedimento"],1,"A abertura de conexões CC sob carga pode produzir arco elétrico."],["Um cabo apresenta isolamento queimado. Qual é a resposta adequada?",["Improvisar reparo","Isolar o risco, registrar e comunicar","Puxar o cabo","Cobrir com qualquer fita"],1,"O desvio deve ser controlado e tratado conforme procedimento."],["Para medir uma string de alta tensão, o instrumento deve ser:",["Qualquer multímetro","Compatível com categoria e tensão do circuito","Um alicate comum","Um equipamento sem inspeção"],1,"Categoria e tensão compatíveis são requisitos de segurança."],["Medir tensão substitui o bloqueio?",["Sim","Não","Somente em CC","Somente em CA"],1,"Medição confirma condição; não substitui o controle das energias."]],"id":2,"badge":"Guardião 02","description":"Treinamento de segurança: Riscos elétricos CC e CA."},{"n":"LOTO: bloqueio e etiquetagem","i":"🔒","p":"Operação segura","l":[["O que é LOTO","LOTO é bloqueio e etiquetagem: o controle que impede a energização acidental durante a manutenção. O cadeado trava o dispositivo de isolamento, e a etiqueta diz quem bloqueou, quando e por quê.",["Cadeado impede, etiqueta informa","Vale para todas as energias perigosas","Protege quem está dentro do serviço"]],["Todas as energias, não só a elétrica","Além da elétrica há energias armazenadas: capacitores, baterias, molas, pressão e peso suspenso. Todas precisam ser identificadas, isoladas e dissipadas antes de começar.",["Elétrica, mecânica, hidráulica e pneumática","Energia residual: capacitores e baterias","Partes móveis, como trackers, também contam"]],["Regras do cadeado","Cada trabalhador aplica o seu cadeado e a sua etiqueta, e só ele os retira. Assim ninguém é energizado enquanto outro ainda trabalha. Cadeado de outra pessoa só sai por procedimento de exceção autorizado.",["Um cadeado por pessoa","Quem pôs é quem retira","Nunca empreste a chave"]],["Passo a passo","Avise a equipe, identifique as energias, desligue e isole, aplique cadeado e etiqueta, dissipe a energia residual e teste a ausência de energia. Para liberar, retire ferramentas, confira que todos saíram, avise a equipe, remova os bloqueios e reenergize.",["Teste depois do bloqueio, sempre","Reenergizar é um momento crítico","Conte as pessoas antes de ligar"]],["Aplicação em campo — LOTO: bloqueio e etiquetagem","Consolide o controle de segurança aplicado a loto: bloqueio e etiquetagem.",["Confirme a condição real antes de agir.","Aplique o procedimento vigente.","Pare e comunique se houver desvio."]]],"x":[["Três técnicos atuam no mesmo equipamento. Quantos cadeados no bloqueio?",["1, do líder","3, um de cada trabalhador","Nenhum, basta a etiqueta"],1,"Cada trabalhador aplica o seu cadeado e só ele o retira."],["Qual é a sequência correta para o LOTO:",["A sequência indicada no procedimento e na etapa de planejamento","Começar imediatamente e corrigir depois","Escolher a opção mais rápida","Pular as etapas de controle"],0,"O teste depois do bloqueio prova que o equipamento está mesmo sem energia."],["Fim do turno: o cadeado de um colega ficou no painel. O que fazer?",["Cortar e liberar o equipamento","Localizar o dono; remoção só pelo procedimento de exceção autorizado","Deixar quem chegar tirar"],1,"Retirar bloqueio alheio fora do procedimento pode matar alguém."],["A etiqueta sozinha, sem cadeado, é suficiente?",["Sim","Não: a etiqueta avisa, o cadeado impede","Só em circuitos CA"],1,"Etiqueta é aviso. O bloqueio físico é a barreira."],["Antes de reenergizar, o que é obrigatório?",["Só ligar","Retirar ferramentas, conferir que todos saíram da área e avisar a equipe","Esperar 1 minuto"],1,"Reenergizar é um momento crítico. Confirme pessoas e ferramentas."],["Qual é a finalidade principal do LOTO?",["Acelerar a manutenção","Impedir energização ou liberação inesperada de energia","Substituir o EPI","Registrar horas"],1,"LOTO controla energias perigosas e evita reenergização acidental."],["Quem deve retirar o cadeado pessoal?",["Qualquer supervisor","Quem aplicou o cadeado, salvo procedimento formal de exceção","O primeiro que chegar","O COG sempre"],1,"O bloqueio pessoal deve permanecer sob controle do trabalhador."],["Qual energia residual pode existir mesmo após desligar a alimentação?",["Somente elétrica","Capacitores, baterias, peso, molas e outras energias armazenadas","Nenhuma","Somente hidráulica"],1,"O LOTO deve considerar todas as fontes e energias residuais."],["Depois de bloquear, o que deve ser confirmado antes do serviço?",["Somente o horário","Ausência da energia perigosa conforme procedimento","Somente a autorização","Somente a etiqueta"],1,"A condição segura deve ser verificada antes da intervenção."],["Na liberação do equipamento, uma etapa crítica é:",["Ligar imediatamente","Conferir pessoas, ferramentas, retirar bloqueios conforme procedimento e comunicar","Ignorar a equipe","Deixar ferramentas no painel"],1,"A reenergização exige conferência e comunicação controladas."]],"id":3,"badge":"Guardião 03","description":"Treinamento de segurança: LOTO: bloqueio e etiquetagem."},{"n":"Arco elétrico e painéis","i":"💥","p":"Operação segura","l":[["O que é arco elétrico","É uma descarga elétrica pelo ar, entre condutores ou para a terra. Em frações de segundo libera calor intenso, luz forte, onda de pressão e metal fundido.",["Causa queimaduras graves","Não precisa encostar em nada","Surge por falha, ferramenta caída ou manobra"]],["Energia incidente e distância","A energia incidente, em cal/cm², mostra quanto calor atinge o corpo a certa distância. Quanto maior, mais forte a proteção exigida. Quando há estudo, a etiqueta do painel informa esse valor.",["cal/cm² define a vestimenta","Mais distância, menos exposição","Leia a etiqueta antes de abrir"]],["Vestimenta de proteção","Use vestimenta contra arco com classe compatível, capacete com viseira facial, luvas e calçado adequados. Evite poliéster e nylon por baixo, porque derretem na pele. A roupa reduz o dano, mas não impede o arco.",["Classe compatível com a energia","Sem sintéticos comuns por baixo","EPI é a última barreira"]],["Boas práticas no painel","Prefira desenergizar. Se precisar manobrar, use comando remoto, fique ao lado, com as portas fechadas, e nunca sozinho. Calor, cheiro de queimado ou deformação pedem afastamento imediato e aviso à supervisão.",["Desenergizar vem primeiro","Manobra ao lado, com porta fechada","Anormalidade: afaste-se e comunique"]],["Aplicação em campo — Arco elétrico e painéis","Consolide o controle de segurança aplicado a arco elétrico e painéis.",["Confirme a condição real antes de agir.","Aplique o procedimento vigente.","Pare e comunique se houver desvio."]]],"x":[["Que tecido é inadequado perto de risco de arco?",["Tecido de proteção térmica contra arco","Poliéster ou nylon comum, que derrete na pele","Algodão tratado para arco"],1,"Sintéticos comuns derretem e agravam a queimadura."],["Ao manobrar um disjuntor em painel, onde se posicionar?",["De frente, bem perto","Ao lado, com a porta fechada e, se possível, com manobra remota","Atrás da porta aberta"],1,"Quanto maior a distância e a barreira, menor a exposição."],["O que define o nível da vestimenta contra arco?",["A cor","A energia incidente (cal/cm²) do local","O tamanho"],1,"A vestimenta deve ter classe compatível com a energia incidente."],["Verdadeiro ou falso: usar a roupa de arco dispensa bloqueio e medição.",["Verdadeiro","Falso"],1,"O EPI é a última barreira. O bloqueio vem antes."],["O painel tem cheiro de queimado e a porta está deformada. Conduta?",["Abrir para ver","Afastar-se, isolar a área e acionar supervisão e COG","Jogar água"],1,"Pode haver falha em evolução. Afaste-se e comunique."],["O arco elétrico pode produzir:",["Somente ruído","Calor intenso, luz, pressão e metal fundido","Somente fumaça","Somente vibração"],1,"O arco pode causar queimaduras graves e outros efeitos físicos."],["O que tende a reduzir a exposição ao arco?",["Diminuir a distância","Aumentar a distância e usar barreiras adequadas","Abrir portas","Usar roupa comum"],1,"Distância e barreiras adequadas reduzem exposição."],["O EPI contra arco substitui a desenergização?",["Sim","Não","Somente em painéis pequenos","Sempre em baixa tensão"],1,"EPI é uma barreira; controles de engenharia e desenergização continuam prioritários."],["Se um painel apresentar fumaça ou cheiro de queimado, a conduta é:",["Abrir imediatamente","Afastar, controlar a área e comunicar","Jogar água","Continuar a manobra"],1,"Sinais de falha exigem afastamento e acionamento da resposta adequada."],["Antes de abrir um painel, deve-se:",["Ignorar a identificação","Confirmar equipamento, condição e procedimento aplicável","Abrir rapidamente","Desligar somente a iluminação"],1,"Identificação e condição segura são fundamentais antes da intervenção."]],"id":4,"badge":"Guardião 04","description":"Treinamento de segurança: Arco elétrico e painéis."},{"n":"Trabalho em altura (NR-35)","i":"🧗","p":"Operação segura","l":[["Quando é trabalho em altura","A NR-35 vale para atividades acima de 2 m do nível inferior, onde há risco de queda. Na usina isso inclui telhados, estruturas, escadas, plataformas e equipamentos elevados.",["Acima de 2 m com risco de queda","Vale também em escadas e plataformas","Exige capacitação, aptidão e autorização"]],["Planejamento e permissão","Antes de subir, faça a análise de risco, avalie o clima e o acesso e confirme se a permissão de trabalho é exigida. Planeje também o resgate: quem sobe precisa ter quem o retire em caso de queda.",["Análise de risco antes de subir","Clima fora do limite: não suba","Plano de resgate definido"]],["Equipamentos","O sistema básico é o cinto tipo paraquedista ligado a talabarte ou trava-quedas, preso a um ponto de ancoragem que suporte a carga. Inspecione tudo antes de cada uso e descarte o que estiver danificado.",["Cinto paraquedista, e não abdominal","Ancoragem resistente e adequada","Inspeção antes de cada uso"]],["Na hora de executar","Conecte-se à ancoragem antes de se expor ao risco e permaneça conectado durante toda a atividade. Prenda ou içe as ferramentas para evitar queda de objetos. Vento forte, raios ou chuva suspendem o trabalho.",["Conectado o tempo todo, sem exceção","Ferramentas presas, para não caírem","Clima adverso: suspender e descer"]],["Aplicação em campo — Trabalho em altura (NR-35)","Consolide o controle de segurança aplicado a trabalho em altura (nr-35).",["Confirme a condição real antes de agir.","Aplique o procedimento vigente.","Pare e comunique se houver desvio."]]],"x":[["Qual é a referência de altura da NR-35?",["1 m","Acima de 2 m do nível inferior, com risco de queda","Acima de 5 m"],1,"A NR-35 vale para atividades acima de 2 m com risco de queda."],["Qual sistema é coerente para trabalho em altura?",["Cinto abdominal e corda","Cinto tipo paraquedista, talabarte ou trava-quedas e ponto de ancoragem","Só capacete"],1,"Cinto paraquedista conectado à ancoragem adequada é a base do sistema."],["Qual é a sequência correta para antes de subir:",["A sequência indicada no procedimento e na etapa de planejamento","Começar imediatamente e corrigir depois","Escolher a opção mais rápida","Pular as etapas de controle"],0,"Conectar-se antes de se expor garante proteção contra queda desde o primeiro passo."],["Vento forte e raios próximos. Conduta?",["Terminar rápido","Suspender a atividade e descer com segurança","Usar mais um talabarte"],1,"Clima adverso suspende o trabalho em altura."],["Quem pode trabalhar em altura?",["Qualquer pessoa","Só quem é capacitado, apto e autorizado pela empresa","Quem tem mais experiência"],1,"Capacitação, aptidão e autorização são requisitos da NR-35."],["A NR-35 se aplica, em regra, a atividades acima de:",["0,5 m","1 m","2 m com risco de queda","10 m"],2,"A NR-35 trata do trabalho em altura acima de 2 m com risco de queda."],["Qual equipamento é base de um sistema individual de proteção contra queda?",["Cinto abdominal","Cinto tipo paraquedista com sistema adequado","Colete refletivo","Apenas capacete"],1,"O cinto tipo paraquedist ica defeitos. A supervisão confere. Todos podem parar uma atividade insegura.",["Empresa fornece e treina","Trabalhador usa e conserva","Todos podem parar o serviço inseguro"]],["Aplicação em campo — EPI, EPC e proteção coletiva","Consolide o controle de segurança aplicado a epi, epc e proteção coletiva.",["Confirme a condição real antes de agir.","Aplique o procedimento vigente.","Pare e comunique se houver desvio."]]],"x":[["O que vem primeiro nos controles de risco?",["EPI","Eliminar ou reduzir o perigo e usar proteção coletiva","Só treinamento"],1,"Proteção coletiva e controles na fonte vêm antes do EPI."],["Antes de usar um EPI, o que verificar?",["Só a cor","CA válido, estado de conservação e adequação ao risco","Só o preço"],1,"EPI danificado ou inadequado não protege."],["A luva isolante está rasgada e faltam 5 minutos de serviço. E agora?",["Usar mesmo assim","Substituir antes de iniciar","Passar fita isolante"],1,"EPI danificado não é usado, e remendo não o recupera."],["Qual é um exemplo de EPC?",["Capacete","Barreira e sinalização isolando a área","Óculos"],1,"EPC protege o grupo todo, e não só quem o usa."],["Quem cuida do EPI no dia a dia?",["Só o supervisor","A empresa fornece e orienta, e cada trabalhador usa e conserva","Ninguém"],1,"A responsabilidade é compartilhada."],["Qual é a prioridade na hierarquia de controles?",["EPI","Eliminar/reduzir o perigo e proteção coletiva","Improvisação","Somente treinamento"],1,"Controles na fonte e proteção coletiva precedem o EPI."],["O CA do EPI deve ser:",["Ignorado","Válido e compatível com o equipamento","Substituído por etiqueta interna","Opcional"],1,"O EPI deve atender aos requisitos aplicáveis e estar adequado ao risco."],["Um EPI danificado deve ser:",["Remendado","Substituído conforme procedimento","Usado até acabar","Emprestado"],1,"EPI danificado não deve ser usado como se estivesse íntegro."],["Qual é um exemplo de EPC?",["Óculos","Barreira coletiva","Luva","Protetor auricular"],1,"Barreiras e isol const save=()=>localStorage.setItem('academia_final',JSON.stringify(S));
const isAdmin=()=>S.profile?.access_role==='ADMIN';
const unlock=(i)=>{if(isAdmin())return true;if(!S.profile?.admission_date)return i===0;let a=new Date(S.profile.admission_date+'T00:00:00');let n=new Date();n.setHours(0,0,0,0);return Math.floor((n-a)/86400000)>=i*7};
const toast=(m)=>{$('toast').textContent=m;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)};
async function sync(){if(!S.profile||!db)return;try{const r=await db.rpc('academia_progress',{p_profile_id:S.profile.profile_id});if(r.error)throw r.error;S.completed=[];S.xp=0;(r.data||[]).forEach(x=>{if(x.status==='completed'){let i=+x.track_number-1;S.completed.push(i);S.xp+=+(x.xp||100)}});S.completed=[...new Set(S.completed)].sort((a,b)=>a-b);save()}catch(e){console.warn(e)}}
function showNav(v=true){$('navbottom').style.display=v?'block':'none';$('adminNav').style.display=(v&&isAdmin())?'block':'none'}
function login(){showNav(false);$('app').innerHTML=`<div class="login"><div class="big">🛡️</div><h1>Guardiões da Usina</h1><p>Academia de Segurança O&M Solar</p><input id="mat" placeholder="Matrícula" autocomplete="username"><input id="pin" placeholder="PIN" type="password" inputmode="numeric" autocomplete="current-password"><div id="err" class="muted" style="min-height:22px"></div><button class="btn" id="go">ENTRAR</button></div>`;$('go').onclick=doLogin;$('pin').onkeydown=e=>{if(e.key==='Enter')doLogin()}}
async function doLogin(){if(!db)return $('err').textContent='Serviço de autenticação indisponível. Recarregue a página.';let m=$('mat').value.trim(),p=$('pin').value.trim();if(!m||!p)return $('err').textContent='Informe matrícula e PIN.';$('go').disabled=true;$('err').textContent='Validando…';try{let r=await db.rpc('academia_login',{p_matricula:m,p_pin:p});if(r.error||!r.data?.length)throw new Error('Matrícula ou PIN inválidos.');S.profile=r.data[0];save();await sync();home()}catch(e){$('err').textContent=e.message||'Não foi possível entrar.';$('go').disabled=false}}
function header(){return `<div class="top"><span class="user">🛡️ ${esc((S.profile.full_name||'Guardião').split(' ')[0])}</span><div class="stats"><span>🏆 ${S.completed.length}/21</span><span>⚡ ${S.xp} XP</span></div></div>`}
function home(){if(!S.profile)return login();showNav(true);let next=S.completed.length===21?20:(CONTENT.findIndex((_,i)=>!S.completed.includes(i))<0?20:CONTENT.findIndex((_,i)=>!S.completed.includes(i)));let html=header()+`<div class="hero"><div class="shield">🛡️</div><h1>GUARDIÕES DA USINA</h1><p>Complete sua trilha de segurança, conquiste XP e avance até se tornar um Guardião.</p></div>`;let last='';CONTENT.forEach((t,i)=>{if(t.p!==last){if(last)html+='</div>';last=t.p;html+=`<div class="ph"><small>SEÇÃO ${['Fundamentos','Operação segura','Riscos da UFV','Cultura e comportamento','Guardião'].indexOf(last)+1||1}</small><h2>${esc(last)}</h2></div><div class="path">`}let done=S.completed.includes(i),u=unlock(i),cur=i===next;html+=`<button class="node ${done?'ok':cur?'cur':!u?'lock':''} ${i%2?'f':''}" ${u&&!done?'onclick="start('+i+')"':''} ${u?'':'disabled'}>${done?'✓':t.i}<span>${esc(t.n)}${u?'':'<br>bloqueado'}</span></button>`});if(last)html+='</div>';html+=`<div style="padding:18px 0"><button class="btn b" onclick="start(${next})" ${unlock(next)?'':'disabled'}>CONTINUAR JORNADA →</button></div>`;$('app').innerHTML=html}
function start(k){if(!unlock(k))return toast('Este treinamento ainda não foi liberado.');if(S.completed.includes(k)){}L={k,stage:0,life:5,score:0,q:0,selected:null,result:null};learn()}
function progress(){let t=CONTENT[L.k],total=15,done=L.stage;return Math.round(done/total*100)}
function lesson(){let t=CONTENT[L.k],s=t.l[L.stage];$('app').innerHTML=`<div class="lh"><button class="x" onclick="home()">✕</button><div class="bar"><i style="width:${progress()}%"></i></div><span class="hearts">${'❤️'.repeat(L.life)}</span></div><div class="card"><small>APRENDA · ${L.stage+1} DE 5</small><h2 class="q">${esc(s[0])}</h2><p>${esc(s[1])}</p><ul>${s[2].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="fb"><div><button class="btn b" onclick="nextLesson()">${L.stage<4?'ENTENDI':'IR PARA OS EXERCÍCIOS'} →</button></div></div>`}
function learn(){if(L.stage<5)lesson();else question()}
function nextLesson(){L.stage++;if(L.stage<5)lesson();else question()}
function question(reset=true){let t=CONTENT[L.k],q=t.x[L.q];if(reset){L.selected=null;L.result=null;}let pct=Math.round((5+L.q)/15*100);$('app').innerHTML=`<div class="lh"><button class="x" onclick="home()">✕</button><div class="bar"><i style="width:${pct}%"></i></div><span class="hearts">${'❤️'.repeat(L.life)||'💔'}</span></div><div class="card"><small>EXERCÍCIO · ${L.q+1} DE 10</small><h2 class="q">${esc(q[0])}</h2>${q[1].map((o,i)=>`<button class="opt ${L.result===null&&L.selected===i?'s':L.result!==null&&i===q[2]?'ok':L.result!==null&&i===L.selected?'no':''}" onclick="choose(${i})" ${L.result!==null?'disabled':''}>${esc(o)}</button>`).join('')}${L.result===null?`<div class="fb"><div><button class="btn" ${L.selected===null?'disabled':''} onclick="check()">VERIFICAR</button></div></div>`:`<div class="fb ${L.result?'ok':'no'}"><div><p>${L.result?'✅ Muito bem!':'❌ Não foi dessa vez.'} ${esc(q[3]||'Revise o conceito e tente novamente.')}</p><button class="btn ${L.result?'':'r'}" onclick="nextQ()">CONTINUAR →</button></div></div>`}</div>`}
function choose(i){if(L.result===null){L.selected=i;question(false)}}
function check(){let q=CONTENT[L.k].x[L.q];if(L.selected===null)return;L.result=L.selected===q[2];if(L.result)L.score++;else L.life--;question(false)}
async function nextQ(){if(L.life<=0)return finish(false);L.q++;if(L.q>=10)return finish(true);question()}
async function finish(completedAttempt){let t=CONTENT[L.k],score=Math.round(L.score/10*100),pass=completedAttempt&&score>=70&&L.life>0;if(!pass){$('app').innerHTML=`<div class="complete"><div class="big">💔</div><h1>Vamos tentar novamente</h1><p>Você fez ${score}%. É necessário atingir pelo menos 70%.</p><button class="btn r" onclick="start(${L.k})">TENTAR NOVAMENTE</button><br><button class="btn b" onclick="home()">VOLTAR À TRILHA</button></div>`;return}try{let code='OEM-'+String(t.id).padStart(2,'0')+'-'+Date.now().toString(36).toUpperCase();let r=await db.rpc('academia_complete_training',{p_profile_id:S.profile.profile_id,p_track_number:t.id,p_certificate_code:code,p_score:score});if(r.error)throw r.error;S.completed=[...new Set([...S.completed,L.k])];S.xp+=100;S.certs.push({i:L.k,code,score,date:new Date().toISOString()});save();$('app').innerHTML=`<div class="complete"><div class="big">🏆</div><h1>Trilha concluída!</h1><p>${esc(t.n)}<br>Resultado: ${score}% · +100 XP</p><button class="btn b" onclick="certificate(${L.k},'${code}',${score})">VER CERTIFICADO →</button><br><button class="btn" onclick="home()">CONTINUAR JORNADA</button></div>`}catch(e){toast('Não foi possível registrar a conclusão.');console.error(e)}}

async function adminDashboard(){if(!isAdmin())return home();showNav(true);$('app').innerHTML=header()+`<div class="hero"><div class="big">📊</div><h1>Evolução da equipe</h1><p>Visão administrativa da Academia.</p></div><div id="admData" class="card"><p>Carregando...</p></div>`;try{let r=await db.rpc('academia_admin_dashboard',{p_profile_id:S.profile.profile_id});if(r.error)throw r.error;let d=r.data||{};$('admData').innerHTML=`<div class="person"><b>Colaboradores</b><br>${d.collaborators||0}</div><div class="person"><b>Conclusões</b><br>${d.completed||0}</div><div class="person"><b>Média</b><br>${d.avg_score||0}%</div><div class="person"><b>Certificados</b><br>${d.certificates||0}</div>${(d.people||[]).map(p=>`<div class="person"><b>${esc(p.full_name||'')}</b><br>${esc(p.employee_code||'')} · ${p.completed||0}/21 · ${p.avg_score||0}% · ${p.xp||0} XP</div>`).join('')}`}catch(e){$('admData').innerHTML='<p>Não foi possível carregar a evolução administrativa.</p>';console.error(e)}}
function certificates(){if(!S.profile)return login();showNav(true);let h=header()+`<div class="hero"><div class="big">🎓</div><h1>Certificados</h1><p>Treinamentos concluídos.</p></div>`;if(!S.certs.length)h+=`<div class="card"><p>Ainda não há certificados nesta sessão.</p></div>`;S.certs.forEach(c=>{let t=CONTENT[c.i];h+=`<div class="person"><b>${esc(t.n)}</b><br><span class="muted">Resultado: ${c.score}% · Código: ${esc(c.code)}</span><button class="btn b" style="margin-top:10px" onclick="certificate(${c.i},'${esc(c.code)}',${c.score})">ABRIR</button></div>`});$('app').innerHTML=h}
function certificate(i,code,score){let t=CONTENT[i],p=S.profile,w=open('','_blank');if(!w)return toast('Permita a abertura da janela para ver o certificado.');w.document.write(`<title>Certificado - O&M Solar</title><body style="margin:0;background:#f4f7f8;font:16px Arial;color:#26343d;padding:40px"><div style="max-width:850px;margin:auto;background:#fff;border:6px solid #1cb0f6;border-radius:24px;padding:55px;text-align:center"><div style="font-size:54px">🛡️</div><p style="color:#1cb0f6;font-weight:bold">ACADEMIA DE SEGURANÇA O&M SOLAR</p><h1>CERTIFICADO DE PARTICIPAÇÃO</h1><p>Certificamos que</p><h2>${esc(p.full_name||'')}</h2><p>Matrícula: ${esc(p.employee_code||'')}</p><p>Cargo: ${esc(p.job_title||'—')} · Unidade: ${esc(p.plant||'—')}</p><p>concluiu o treinamento</p><h2>${esc(t.n)}</h2><p>Resultado: ${score}% · Data: ${new Date().toLocaleDateString('pt-BR')}</p><p>Código: ${esc(code)}</p><hr><small>Documento interno de participação e conclusão de treinamento. Não substitui capacitação, habilitação, autorização ou certificado oficial exigido por Norma Regulamentadora. Sem assinatura.</small></div><script>setTimeout(()=>print(),300)<\/script></body>`);w.document.close()}
function profile(){if(!S.profile)return login();showNav(true);$('app').innerHTML=header()+`<div class="hero"><div class="big">👤</div><h1>${esc(S.profile.full_name||'Guardião')}</h1><p>Matrícula: ${esc(S.profile.employee_code||'—')}<br>${esc(S.profile.job_title||'—')} · ${esc(S.profile.plant||'—')}</p><div class="person"><b>Progresso</b><br>${S.completed.length}/21 treinamentos · ${S.xp} XP</div><button class="btn r" onclick="logout()">SAIR</button></div>`}
function logout(){S={profile:null,completed:[],xp:0,certs:[]};localStorage.removeItem('academia_final');login()}
$('homeNav').onclick=home;$('certNav').onclick=certificates;$('profileNav').onclick=profile;$('adminNav').onclick=adminDashboard;
if(S.profile){sync().then(home)}else login();
</script></body></html>
