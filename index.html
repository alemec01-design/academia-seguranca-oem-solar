<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06101c"><title>O&M Solar | Academia de Segurança</title><link rel="stylesheet" href="game.css"></head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><img src="logo-om-solar.png"><div><b>ACADEMIA DE SEGURANÇA</b><small>O&M SOLAR • OPERAÇÃO & MANUTENÇÃO</small></div></div>
  <nav><button data-view="home">⌂ Início</button><button data-view="journey">◈ Minha Jornada</button><button data-view="trainings">▣ Treinamentos</button><button data-view="certs">▤ Certificados</button><button data-view="ranking">♛ Ranking</button><button id="adminViewBtn" data-view="admin" hidden>📊 Evolução</button></nav>
  <div class="userbox"><span id="level">01</span><div><b id="playerName">ENTRAR</b><small id="roleLabel">COLABORADOR</small></div><button id="profileBtn">◉</button></div>
</header>
<main id="appMain"></main>
</div>
<div class="modal" id="loginModal"><div class="modal-card login-card"><button class="x" data-close="loginModal">×</button><span class="eyebrow">ACESSO À ACADEMIA</span><h2>Entre na sua jornada</h2><p>Use matrícula e PIN de colaborador.</p><div class="login-field"><label for="loginMat">Matrícula</label><input id="loginMat" type="text" inputmode="numeric" autocomplete="off" placeholder="Ex.: 101" tabindex="1"></div><div class="login-field"><label for="loginPin">PIN</label><input id="loginPin" type="text" inputmode="numeric" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="8" placeholder="Digite seu PIN" tabindex="2"></div><div id="loginNotice" class="notice hidden"></div><button class="primary wide" id="loginBtn">ENTRAR</button></div></div>
<div class="modal" id="profileModal"><div class="modal-card"><button class="x" data-close="profileModal">×</button><span class="eyebrow">PERFIL</span><h2 id="profileTitle">Meu perfil</h2><div id="profileBody"></div></div></div>
<div class="modal training-modal" id="trainingModal"><div class="lesson"><div class="lesson-head"><div><span class="eyebrow" id="lessonEyebrow"></span><h2 id="lessonTitle"></h2><p id="lessonDesc"></p></div><button class="x" data-close="trainingModal">×</button></div><div class="lesson-tabs"><button class="active" data-tab="aula">AULA</button><button data-tab="video">VÍDEO</button><button data-tab="caso">CASO PRÁTICO</button><button data-tab="avaliacao">AVALIAÇÃO</button></div><section id="lessonArea"></section></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="content.js"></script><script src="game.js"></script>
</body></html>
